# ATAC-seq Peak Calling & Differential Accessibility — Configuration Template
# Steps: FastQC → fastp → Bowtie2 → markdup → MACS3 → DiffBind → IDR

# ── Input ─────────────────────────────────────────────────────────────────────
# CSV with header: sample,group,r1,r2
# group = condition label used in DiffBind contrasts
samplesheet: "/path/to/samplesheet.csv"

# ── Reference ─────────────────────────────────────────────────────────────────
genome_fasta: "/path/to/genome.fa"
genome_size: "2.7e9"             # Effective genome size for MACS3 (hs=2.7e9, mm=1.87e9, custom=genome_fa size)
blacklist: ""                    # BED file of ENCODE/custom blacklist regions (leave empty to skip)

# ── Analysis ──────────────────────────────────────────────────────────────────
comparisons:                     # DiffBind contrasts: [numerator, denominator]
  - ["treatment", "control"]

padj_threshold: 0.05
log2fc_threshold: 1.0

# ── Resources ─────────────────────────────────────────────────────────────────
threads: 64
mem_gb: 128

# ── Output ────────────────────────────────────────────────────────────────────
outdir: "/path/to/output"
