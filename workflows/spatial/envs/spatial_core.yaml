name: spatial_core
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - scanpy>=1.10
  - squidpy>=1.4
  - anndata>=0.10
  - leidenalg
  - python-igraph
  - harmonypy          # batch correction for multi-section integration
  - scikit-learn
  - scipy
  - numpy
  - pandas
  - matplotlib
  - seaborn
  - matplotlib-scalebar  # scale bar on spatial plots
  - tqdm
  - h5py
  - hdf5plugin
  - pip
  - pip:
    - liana>=1.1.0        # ligand-receptor analysis (wraps CellChat, NicheNet etc.)
    - spatialdata>=0.2.0  # unified spatial format (future-proof)
    - spatialdata-io>=0.1.0  # platform readers: Xenium, Visium HD, MERFISH etc.
